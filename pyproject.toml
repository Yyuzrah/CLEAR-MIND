[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "em-connectome"
version = "0.1.0"
description = "Reproducible Arakelov–Green connectome classification experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "License to be selected before public release"}
authors = [
  {name = "EM Connectome authors"},
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.scripts]
em-connectome = "em_connectome.cli:main"

[project.optional-dependencies]
train = [
  "scikit-learn>=1.4",
  "torch>=2.2",
  "tqdm>=4.66",
]
test = [
  "nbformat>=5.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/em_connectome"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = ["RUF002"]
